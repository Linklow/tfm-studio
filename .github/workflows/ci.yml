name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core library and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/TfmStudio.Core.Tests -c Release
      - name: Build CLI and benchmarks
        run: |
          dotnet build src/TfmStudio.Cli -c Release
          dotnet build bench/TfmStudio.Benchmarks -c Release

  app:
    name: WPF application (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build TfmStudio.slnx -c Release
